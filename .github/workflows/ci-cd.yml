name: BSTE Islamabad Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "release/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Next.js Type Check & Build
        run: npm run build

      - name: Install & Build NestJS Backend
        run: |
          cd backend
          npm ci
          npm run build

      - name: Run Next.js Linting
        run: npm run lint

  deploy-production:
    name: Deploy to Production Cloud
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy Announcement
        run: echo "🚀 Successfully verified, built, and staged for BSTE Islamabad Production Cloud Deployment."
