apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bste-frontend-hpa
  namespace: bste-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bste-frontend-deployment
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bste-backend-hpa
  namespace: bste-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bste-backend-deployment
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
